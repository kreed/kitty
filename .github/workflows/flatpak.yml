name: Flatpak

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flatpak
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Kitty
        uses: actions/checkout@v4

      - name: Check out private libdecor fork
        uses: actions/checkout@v4
        with:
          repository: kreed/libdecor
          path: _sources/libdecor
          ssh-key: ${{ secrets.LIBDECOR_DEPLOY_KEY }}

      - name: Install Flatpak action prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: kitty-chrome.flatpak
          manifest-path: flatpak/io.github.kreed.KittyChrome.json
          cache-key: flatpak-builder-${{ github.sha }}
